# Pinched and adapted from the meson wrapdb Sanity Checks
# https://github.com/mesonbuild/wrapdb/blob/897fb47c005c043aab20eda1fbc4bf68d86da713/.github/workflows/sanity_checks.yml
name: Windows
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/windows.yml'
  pull_request:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/windows.yml'

jobs:
  MSYS2:
      runs-on: windows-latest
      strategy:
        fail-fast: false
        matrix:
          platform: ['UCRT64', 'CLANG64']
      steps:
        - uses: actions/checkout@v7

        - uses: msys2/setup-msys2@v2
          with:
            msystem: ${{matrix.platform}}
            pacboy: >-
              cc:p
              cmake:p
              ninja:p
              pkgconf:p
              python-certifi:p
              python-pip:p
            # Make sure Python is updated to >=3.11 (fix https://github.com/msys2/MINGW-packages/issues/17415).
            update: true

        - name: Install packages
          shell: msys2 {0}
          run: |
            python -m pip install --pre meson

        - name: Configure
          shell: msys2 {0}
          run: meson setup builddir -Ddefault_library=static -Db_sanitize=none

        - name: Build
          shell: msys2 {0}
          run: meson compile -C builddir

        - name: Test
          shell: msys2 {0}
          run: meson test -C builddir || cat builddir\meson-logs\testlog.txt

  VisualStudio:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['x64', 'x86']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          architecture: ${{ matrix.platform == 'x86' && 'x86' || 'x64' }}
          python-version: '3.12'

      - name: Remove bad Strawberry Perl patch binary in search path
        run: del C:\Strawberry\c\bin\patch.EXE
        continue-on-error: true

      - name: Install meson
        run: |
          python -m pip install --pre meson

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.platform}}

      - name: Configure
        run: meson setup builddir -Ddefault_library=static -Db_sanitize=none

      - name: Build
        run: meson compile -C builddir

      - name: Test
        shell: cmd
        env:
          PYTHONUTF8: 1
        run: meson test --no-stdsplit -v -C builddir || (if exist builddir\meson-logs\testlog.txt type builddir\meson-logs\testlog.txt)
