name: C/C++ CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/c-cpp.yml'
  pull_request:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/c-cpp.yml'

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt remove -y firefox
        sudo apt upgrade -y
        sudo apt install -y meson ninja-build

    - name: Setup
      env:
        CFLAGS: '-Werror -fno-sanitize-recover=all'
      run: |
        meson setup _build -Db_sanitize=address,undefined -Db_lundef=false
    - name: Build
      run: meson compile -C _build
    - name: Test
      run: meson test --no-stdsplit -v -C _build

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - run: brew install meson
    - run: |
       meson setup _build -Db_sanitize=address,undefined -Db_lundef=false
       cd _build
       ninja
       meson test -v
  rmw:
    runs-on: ubuntu-latest
    needs:
      - linux
    steps:
    - uses: actions/checkout@v6
      with:
        path: 'subprojects/canfigger'
    - uses: actions/checkout@v6
      with:
        repository:
          'theimpossibleastronaut/rmw'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt remove -y firefox
        sudo apt upgrade -y
        sudo apt install -y \
            libglib2.0-dev \
            meson \
            ninja-build

    - name: Configure
      run: meson setup builddir -Dwithout-curses=true -Dnls=false

    - name: Build and Test
      run: meson test -v -C builddir
