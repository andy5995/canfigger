# Pinched and adapted from the meson wrapdb Sanity Checks
# https://github.com/mesonbuild/wrapdb/blob/897fb47c005c043aab20eda1fbc4bf68d86da713/.github/workflows/sanity_checks.yml
name: Windows
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/windows.yml'
  pull_request:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/windows.yml'

jobs:
  VisualStudio:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['x64', 'x86']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install a 32-bit Python so building related stuff work.
      - name: Setup x86 Python
        if: matrix.platform == 'x86'
        uses: actions/setup-python@v5
        with:
          architecture: 'x86'
          python-version: '3.12'

      # https://github.com/actions/runner-images/issues/5459#issuecomment-1532856844
      - name: Remove bad Strawberry Perl patch binary in search path
        run: del C:\Strawberry\c\bin\patch.EXE

      - name: Install packages
        run: |
          python -m pip install --pre meson

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.platform}}
      - name: Configure
        run: meson setup builddir -Db_sanitize=none

      - name: Build
        run: meson compile -C builddir

      - name: Test
        run: |
          meson test -v -C builddir || cat builddir\meson-logs\testlog.txt

