# Pinched and adapted from the meson wrapdb Sanity Checks
# https://github.com/mesonbuild/wrapdb/blob/897fb47c005c043aab20eda1fbc4bf68d86da713/.github/workflows/sanity_checks.yml
name: Windows
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/windows.yml'
  pull_request:
    branches: trunk
    paths:
    - '**'
    - '!**.md'
    - '!docs/**'
    - '!**.yml'
    - '**/windows.yml'

jobs:
  MSYS2:
      runs-on: windows-latest
      strategy:
        fail-fast: false
        matrix:
          platform: ['UCRT64', 'CLANG64']
      steps:
        - uses: actions/checkout@v6

        - uses: msys2/setup-msys2@v2
          with:
            msystem: ${{matrix.platform}}
            pacboy: >-
              cc:p
              cmake:p
              ninja:p
              pkgconf:p
              python-certifi:p
              python-pip:p
            # Make sure Python is updated to >=3.11 (fix https://github.com/msys2/MINGW-packages/issues/17415).
            update: true

        - name: Install packages
          shell: msys2 {0}
          run: |
            python -m pip install --pre meson

        - name: Configure
          shell: msys2 {0}
          run: meson setup builddir -Ddefault_library=static -Db_sanitize=none

        - name: Build
          shell: msys2 {0}
          run: meson compile -C builddir

        - name: Test
          shell: msys2 {0}
          run: meson test -C builddir || cat builddir\meson-logs\testlog.txt

